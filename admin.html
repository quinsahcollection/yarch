<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Manga App</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .admin-container { max-width: 500px; background: white; padding: 25px; border-radius: 8px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #007aff; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; margin-top: 10px; }
        button:hover { background: #005bb5; }
        
        .btn-logout { background: #dc3545; margin-bottom: 20px; width: auto; float: right; padding: 8px 15px; font-size: 14px;}
        .btn-logout:hover { background: #c82333; }
        
        .status-msg { margin-top: 15px; font-weight: bold; text-align: center; }
        .hidden { display: none !important; }
        .clearfix::after { content: ""; clear: both; display: table; }
        .help-text { font-size: 12px; color: #666; margin-top: 5px; display: block; }
    </style>
</head>
<body>

<div class="admin-container">

    <!-- ==================== SEGMEN LOGIN ==================== -->
    <div id="loginSection">
        <h2 style="text-align: center; color: #333;">Login Admin</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Admin</label>
                <input type="email" id="adminEmail" required placeholder="admin@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" required placeholder="******">
            </div>
            <button type="submit">Masuk</button>
        </form>
        <div id="loginStatus" class="status-msg"></div>
    </div>

    <!-- ==================== SEGMEN UPLOAD ==================== -->
    <div id="uploadSection" class="hidden clearfix">
        <button id="logoutBtn" class="btn-logout">Logout</button>
        <h2 style="margin-top: 0; color: #333;">Upload Komik Baru</h2>
        
        <form id="uploadForm">
            <div class="form-group">
                <label>Kunci Rahasia Worker (X-Admin-Key)</label>
                <!-- Di sinilah kamu memasukkan ADMIN_SECRET_KEY yang kamu buat di Cloudflare -->
                <input type="password" id="secretKey" required placeholder="Masukkan Secret Key R2...">
                <span class="help-text">Tenang, kunci ini akan diingat otomatis oleh browsermu setelah upload pertama.</span>
            </div>
            <div class="form-group">
                <label>Judul Komik</label>
                <input type="text" id="title" required placeholder="Contoh: One Piece Chapter 1000">
            </div>
            <div class="form-group">
                <label>Gambar Cover (.jpg, .png)</label>
                <input type="file" id="coverImage" accept="image/*" required>
            </div>
            <button type="submit">Upload Sekarang</button>
        </form>
        <div id="uploadStatus" class="status-msg"></div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAt1V2Ogx0P8rSLSNz9_zZpYt00cCN5JL0",
        authDomain: "yarch-b63d8.firebaseapp.com",
        projectId: "yarch-b63d8",
        storageBucket: "yarch-b63d8.firebasestorage.app",
        messagingSenderId: "778365226622",
        appId: "1:778365226622:web:56a71b1fbf4e5fbc8f522f",
        measurementId: "G-7K4Q05DV11"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const WORKER_URL = "https://yarch.hrmnkosasi.workers.dev/";

    const loginSection = document.getElementById('loginSection');
    const uploadSection = document.getElementById('uploadSection');
    const loginStatus = document.getElementById('loginStatus');
    const uploadStatus = document.getElementById('uploadStatus');
    const secretKeyInput = document.getElementById('secretKey');

    // --- FITUR MENGINGAT KUNCI RAHASIA ---
    // Cek apakah browser sudah pernah menyimpan kunci sebelumnya
    const savedSecretKey = localStorage.getItem('workerSecretKey');
    if (savedSecretKey) {
        secretKeyInput.value = savedSecretKey; // Isi otomatis!
    }

    // --- CEK SESI LOGIN ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            loginSection.classList.add('hidden');
            uploadSection.classList.remove('hidden');
        } else {
            loginSection.classList.remove('hidden');
            uploadSection.classList.add('hidden');
        }
    });

    // --- LOGIN ---
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        loginStatus.innerText = "Memeriksa kredensial...";
        loginStatus.style.color = "blue";
        
        const email = document.getElementById('adminEmail').value;
        const password = document.getElementById('adminPassword').value;

        try {
            await signInWithEmailAndPassword(auth, email, password);
            loginStatus.innerText = ""; 
        } catch (error) {
            loginStatus.innerText = "Login Gagal: Periksa email & password!";
            loginStatus.style.color = "red";
        }
    });

    // --- LOGOUT ---
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await signOut(auth);
        uploadStatus.innerText = ""; 
        document.getElementById('loginForm').reset();
    });

    // --- PROSES UPLOAD ---
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (!auth.currentUser) return;

        uploadStatus.innerText = "Mengunggah gambar ke R2...";
        uploadStatus.style.color = "blue";
        
        const currentSecretKey = secretKeyInput.value;
        const fileInput = document.getElementById('coverImage').files[0];
        
        const formData = new FormData();
        formData.append('coverImage', fileInput);

        try {
            const workerResponse = await fetch(WORKER_URL, {
                method: 'POST',
                headers: {
                    'X-Admin-Key': currentSecretKey 
                },
                body: formData
            });
            
            const workerData = await workerResponse.json();
            
            if (!workerResponse.ok) {
                throw new Error(workerData.error || "Gagal upload ke Server R2");
            }

            // SIMPAN KUNCI KE BROWSER JIKA UPLOAD BERHASIL
            // (Jadi kalau kuncinya benar, akan diingat untuk selamanya di komputermu)
            localStorage.setItem('workerSecretKey', currentSecretKey);

            uploadStatus.innerText = "Gambar berhasil diunggah! Menyimpan ke Database...";

            await addDoc(collection(db, "comics"), {
                title: document.getElementById('title').value,
                coverUrl: workerData.url, 
                uploader: auth.currentUser.email,
                views: 0,
                createdAt: serverTimestamp()
            });

            uploadStatus.innerText = "Upload Komik Berhasil Sempurna!";
            uploadStatus.style.color = "green";
            
            // Hanya hapus input judul dan gambar, Kunci Rahasia tetap aman di kolomnya
            document.getElementById('title').value = "";
            document.getElementById('coverImage').value = "";

        } catch (error) {
            uploadStatus.innerText = "Error: " + error.message;
            uploadStatus.style.color = "red";
        }
    });
</script>
</body>
</html>
